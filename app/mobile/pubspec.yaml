name: telept_body_capture
description: "TelePT 3D Body Capture – record video, upload to GPU server, view mesh."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Camera / Video
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Networking
  http: ^1.2.1
  dio: ^5.4.3+1

  # File handling
  path_provider: ^2.1.3
  archive: ^3.6.1

  # 3D rendering (Canvas-based, no OpenGL dependency needed)
  vector_math: ^2.1.4

  # Video playback
  video_player: ^2.9.2

  # Persistent settings (server URL)
  shared_preferences: ^2.3.1

  # UI
  permission_handler: ^11.3.1

  # BLE (load cell sensor)
  bluetooth_low_energy: ^6.1.0

  # Charts (sensor timeline)
  syncfusion_flutter_charts: ^28.1.38

  # LLM (Gemini)
  google_generative_ai: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
